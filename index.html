<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114"><meta name="description" content="Workout tracker">
<title>Workout</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./css/style.css?v=33"><link rel="stylesheet" href="./css/dashboard-layout.css?v=33">
<link rel="stylesheet" href="./css/activity-card.css?v=33">
</head>
<body>
<div class="app-shell">
<header class="topbar"><a class="brand" href="#home"><span class="brand-mark">W</span>Workout</a><button type="button" class="icon-button settings-trigger" id="openSoundSettings" aria-label="Rest alarm settings" title="Rest alarm settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 13.5 1.1.8-1.5 2.6-1.3-.6a7.6 7.6 0 0 1-1.6.9l-.2 1.4h-3l-.2-1.4a7.6 7.6 0 0 1-1.6-.9l-1.3.6-1.5-2.6 1.1-.8a7 7 0 0 1 0-1.9l-1.1-.8 1.5-2.6 1.3.6a7.6 7.6 0 0 1 1.6-.9l.2-1.4h3l.2 1.4a7.6 7.6 0 0 1 1.6.9l1.3-.6 1.5 2.6-1.1.8a7 7 0 0 1 0 1.9Z"/></svg></button></header>
<main id="app" class="main-content">
<section class="welcome"><h1>Today</h1><span class="date-pill" id="todayDate"></span></section><section class="sound-settings panel" id="soundSettings" hidden><div class="section-heading"><div><h2>Rest alarm</h2><p class="calendar-subtitle">Choose a sound for when rest ends</p></div><button type="button" class="secondary-button" id="closeSoundSettings" aria-label="Close sound settings">×</button></div><label class="sound-label">Choose an alarm</label><div class="sound-choice-list" id="soundPresetList"><button type="button" class="sound-choice" data-sound="pulse"><span>Pulse</span><span class="sound-choice-check"></span></button><button type="button" class="sound-choice" data-sound="beacon"><span>Beacon</span><span class="sound-choice-check"></span></button><button type="button" class="sound-choice" data-sound="double"><span>Double alert</span><span class="sound-choice-check"></span></button><button type="button" class="sound-choice" data-sound="rise"><span>Rising alert</span><span class="sound-choice-check"></span></button><button type="button" class="sound-choice" data-sound="bell"><span>Glass bell</span><span class="sound-choice-check"></span></button><button type="button" class="sound-choice" data-sound="custom" id="customSoundChoice" hidden><span>My uploaded sound</span><span class="sound-choice-check"></span></button></div><button type="button" class="secondary-button preview-sound" id="previewRestAlarm"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 10 6-10 6z"/></svg> Preview selected</button><label class="sound-label" for="restAlarmUpload">Upload your own sound</label><input class="field sound-upload" id="restAlarmUpload" type="file" accept="audio/*"><p class="sound-help" id="restAlarmFileStatus">Choose an audio file up to 8 MB. It stays on this device.</p><button type="button" class="secondary-button" id="removeRestAlarmFile" hidden>Remove uploaded sound</button></section>
<section class="panel"><div class="section-heading"><h2>Workout</h2></div><div id="workoutSummary" class="empty-state"><span class="empty-icon">＋</span><h3>No workout</h3><button class="primary-button" id="startSampleButton">Start workout</button></div></section>
<section class="quick-stats"><article class="stat-card"><span class="muted">Workouts</span><strong id="workoutCount">0</strong></article><article class="stat-card"><span class="muted">Time</span><strong id="trainingTime">0m</strong></article><article class="stat-card"><span class="muted">Streak</span><strong id="streak">0</strong></article></section>
<section class="calendar-section contribution-section" aria-label="Workout progress"><div class="section-heading"><div><h2>Activity</h2><p class="calendar-subtitle" id="activitySummary">Last 12 months</p></div><div class="activity-toggle" role="group" aria-label="Calendar view"><button type="button" class="active" id="monthViewButton">Month</button><button type="button" id="yearViewButton">Year</button></div></div><div id="monthCalendar"><div class="month-toolbar"><button class="secondary-button calendar-nav" id="monthPrev" aria-label="Previous month">‹</button><strong id="monthLabel"></strong><button class="secondary-button calendar-nav" id="monthNext" aria-label="Next month">›</button></div><div class="month-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="month-grid" id="monthGrid"></div></div><div id="yearCalendar" hidden><div class="contribution-scroll"><div class="contribution-chart"><div class="contribution-months" id="contributionMonths"></div><div class="contribution-body"><div class="contribution-grid" id="contributionGrid"></div></div></div></div></div><div class="contribution-legend"><i class="level-0"></i><i class="level-1"></i><i class="level-2"></i><i class="level-3"></i><i class="level-4"></i></div></section>
<section class="recent-section"><div class="section-heading"><h2>Recent</h2><button type="button" class="clear-activities" id="clearActivities">Clear</button></div><div id="recentWorkouts" class="empty-note">No workouts yet</div></section>
</main>
<nav class="bottom-nav"><a class="nav-item active" href="#home"><span>⌂</span>Home</a><a class="nav-item" href="#routines"><span>▤</span>Routines</a><a class="nav-item" href="#journal"><span>◷</span>Journal</a><a class="nav-item" href="#progress"><span>↗</span>Progress</a></nav>
</div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./js/storage.js?v=33" defer></script><script src="./js/routines.js?v=33" defer></script><script src="./js/alarm.js?v=33" defer></script><script src="./js/timer.js?v=33" defer></script><script src="./js/journal.js?v=33" defer></script><script src="./js/app.js?v=33" defer></script>
</body></html>
