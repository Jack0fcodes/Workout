<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114"><meta name="description" content="Workout tracker">
<title>Workout</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./css/style.css?v=25"><link rel="stylesheet" href="./css/dashboard-layout.css?v=25">
<link rel="stylesheet" href="./css/activity-card.css?v=25">
</head>
<body>
<div class="app-shell">
<header class="topbar"><a class="brand" href="#home"><span class="brand-mark">W</span>Workout</a><button class="icon-button" id="themeButton" aria-label="Appearance">◐</button></header>
<main id="app" class="main-content">
<section class="welcome"><h1>Today</h1><span class="date-pill" id="todayDate"></span></section>
<section class="panel"><div class="section-heading"><h2>Workout</h2></div><div id="workoutSummary" class="empty-state"><span class="empty-icon">＋</span><h3>No workout</h3><button class="primary-button" id="startSampleButton">Start workout</button></div></section>
<section class="quick-stats"><article class="stat-card"><span class="muted">Workouts</span><strong id="workoutCount">0</strong></article><article class="stat-card"><span class="muted">Time</span><strong id="trainingTime">0m</strong></article><article class="stat-card"><span class="muted">Streak</span><strong id="streak">0</strong></article></section>
<section class="calendar-section contribution-section" aria-label="Workout progress"><div class="section-heading"><div><h2>Activity</h2><p class="calendar-subtitle" id="activitySummary">Last 12 months</p></div><div class="activity-toggle" role="group" aria-label="Calendar view"><button type="button" class="active" id="monthViewButton">Month</button><button type="button" id="yearViewButton">Year</button></div></div><div id="monthCalendar"><div class="month-toolbar"><button class="secondary-button calendar-nav" id="monthPrev" aria-label="Previous month">‹</button><strong id="monthLabel"></strong><button class="secondary-button calendar-nav" id="monthNext" aria-label="Next month">›</button></div><div class="month-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="month-grid" id="monthGrid"></div></div><div id="yearCalendar" hidden><div class="contribution-scroll"><div class="contribution-chart"><div class="contribution-months" id="contributionMonths"></div><div class="contribution-body"><div class="contribution-grid" id="contributionGrid"></div></div></div></div></div><div class="contribution-legend"><i class="level-0"></i><i class="level-1"></i><i class="level-2"></i><i class="level-3"></i><i class="level-4"></i></div></section>
<section class="recent-section"><div class="section-heading"><h2>Recent</h2></div><div id="recentWorkouts" class="empty-note">No workouts yet</div></section>
</main>
<nav class="bottom-nav"><a class="nav-item active" href="#home"><span>⌂</span>Home</a><a class="nav-item" href="#routines"><span>▤</span>Routines</a><a class="nav-item" href="#journal"><span>◷</span>Journal</a><a class="nav-item" href="#progress"><span>↗</span>Progress</a></nav>
</div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./js/storage.js?v=25" defer></script><script src="./js/routines.js?v=25" defer></script><script src="./js/timer.js?v=25" defer></script><script src="./js/journal.js?v=25" defer></script><script src="./js/app.js?v=25" defer></script>
</body></html>
