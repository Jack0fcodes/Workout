<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114"><meta name="description" content="Workout tracker">
<title>Workout</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./css/style.css?v=8">
</head>
<body>
<div class="app-shell">
<header class="topbar"><a class="brand" href="#home"><span class="brand-mark">W</span>Workout</a><button class="icon-button" id="themeButton" aria-label="Appearance">◐</button></header>
<main id="app" class="main-content">
<section class="welcome"><h1>Today</h1><span class="date-pill" id="todayDate"></span></section>
<section class="panel"><div class="section-heading"><h2>Workout</h2></div><div id="workoutSummary" class="empty-state"><span class="empty-icon">＋</span><h3>No workout</h3><button class="primary-button" id="startSampleButton">Start workout</button></div></section>
<section class="quick-stats"><article class="stat-card"><span class="muted">Workouts</span><strong id="workoutCount">0</strong></article><article class="stat-card"><span class="muted">Time</span><strong id="trainingTime">0m</strong></article><article class="stat-card"><span class="muted">Streak</span><strong id="streak">0</strong></article></section>
<section class="recent-section"><div class="section-heading"><h2>Recent</h2></div><div id="recentWorkouts" class="empty-note">No workouts yet</div></section>
</main>
<nav class="bottom-nav"><a class="nav-item active" href="#home"><span>⌂</span>Home</a><a class="nav-item" href="#routines"><span>▤</span>Routines</a><a class="nav-item" href="#journal"><span>◷</span>Journal</a><a class="nav-item" href="#progress"><span>↗</span>Progress</a></nav>
</div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./js/storage.js?v=8" defer></script><script src="./js/routines.js?v=8" defer></script><script src="./js/timer.js?v=8" defer></script><script src="./js/journal.js?v=8" defer></script><script src="./js/app.js?v=8" defer></script>
</body></html>
